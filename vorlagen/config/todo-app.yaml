schema: spec-driven

context: |
  ToDo-App im Browser für eine Person, ohne Anmeldung.
  Ziel: Aufgaben schnell erfassen, ändern und nach Wichtigkeit ordnen.
  Plain JavaScript im Browser, ohne Bibliotheken und ohne Build-Schritt.
  Tests mit dem eingebauten Testmodul node:test, ohne Pakete.
  ADRs in adr/ (MADR 4.0.0) gelten für jeden Change.
  Artefakte auf Deutsch.

rules:
  design:
    - Vorher adr/ lesen. Abweichung nur mit neuem ADR.
  tasks:
    - Je Szenario zuerst ein Unit-Test, vor dem Code. Er übernimmt das erwartete Ergebnis wörtlich aus dem THEN.
    - Der Testname enthält den Szenario-Namen.
