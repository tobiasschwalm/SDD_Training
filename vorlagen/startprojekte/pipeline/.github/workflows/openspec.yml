# Prüft Specs und offene Changes an jedem Pull Request.
# Eigenes Schema: openspec/schemas/ muss committet sein. validate prüft das nicht,
# aber status und instructions brechen ohne den Ordner mit „Unknown schema“ ab.
name: OpenSpec

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Specs und Changes prüfen
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx -y @fission-ai/openspec@2.0.0 validate --all --strict --no-interactive
