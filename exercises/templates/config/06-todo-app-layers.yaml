schema: spec-driven

context: |
  Project: to-do app
  Description: application for managing tasks in a to-do list

  Tech stack:
    - HTML5
    - JavaScript
    - LocalStorage for persistence
    - node:test for unit tests in test/

  Conventions:
    - All source code in src/
    - Modern UI
    - One plain CSS file per UI component, no build step
    - Plain JavaScript and CSS, no libraries
    - Less code is better code

  Architecture:
    - UI layer (src/ui/): shows the tasks, may use the logic layer
    - Logic layer (src/logic/): rules for tasks, no DOM, no storage, uses no other layer
    - Persistence layer (src/persistence/): saves the tasks in LocalStorage, uses no other layer
    - src/main.js: starts the app, loads the tasks via persistence, completes them via the logic and connects UI and persistence

  Non-goals:
    - Authentication and user accounts
    - Mobile-first (responsive, but desktop-first)
